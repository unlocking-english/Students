name: Publish teacher editor

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Students site
        uses: actions/checkout@v4

      - name: Check out private Teaching-data source
        uses: actions/checkout@v4
        with:
          repository: unlocking-english/Teaching-data
          token: ${{ secrets.TEACHING_DATA_READ_TOKEN }}
          path: teaching-data

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build dependency
        run: python -m pip install cryptography

      - name: Build encrypted editor
        run: python teaching-data/system/cabinet/build_teacher.py

      - name: Publish editor
        run: |
          mkdir -p editor
          cp teaching-data/system/cabinet/out/editor-index.html editor/index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add editor/index.html
          if git diff --cached --quiet; then
            echo "Editor is already up to date."
          else
            git commit -m "Publish updated teacher editor"
            git push
          fi
