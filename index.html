  var saved=null; try{saved=localStorage.getItem(KEY);}catch(e){}
  if(saved&&!hk){open(saved).then(show).catch(function(){try{localStorage.removeItem(KEY);}catch(e){}});}
  document.getElementById("f").addEventListener("submit",function(e){
    e.preventDefault();
    var pw=document.getElementById("pw").value, err=document.getElementById("err");
    err.textContent="Проверяю…";
    open(pw).then(function(html){
      if(document.getElementById("rm").checked){try{localStorage.setItem(KEY,pw);}catch(e){}}
      show(html);
    }).catch(function(){err.textContent="Неверный пароль. Проверь и попробуй ещё раз.";});
  });
})();
</script>
</body>
</html>
