c5EQMUty7Rhde8H+RkUDWoLhaJUAQBxdVq", ITER=310000;
  var KEY="cab:"+location.pathname;
  function b64(s){var r=atob(s),u=new Uint8Array(r.length);for(var i=0;i<r.length;i++)u[i]=r.charCodeAt(i);return u;}
  async function open(pw){
    var base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
    var key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b64(SALT),iterations:ITER,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
    var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64(IV)},key,b64(CT));
    return new TextDecoder().decode(pt);
  }
  function show(html){document.open();document.write(html);document.close();}
  var hk=null; if(location.hash.indexOf("#k=")===0){hk=decodeURIComponent(location.hash.slice(3)); try{history.replaceState(null,"",location.pathname);}catch(e){}}
  if(hk){open(hk).then(show).catch(function(){});}
  var saved=null; try{saved=localStorage.getItem(KEY);}catch(e){}
  if(saved&&!hk){open(saved).then(show).catch(function(){try{localStorage.removeItem(KEY);}catch(e){}});}
  document.getElementById("f").addEventListener("submit",function(e){
    e.preventDefault();
    var pw=document.getElementById("pw").value, err=document.getElementById("err");
    err.textContent="Проверяю…";
    open(pw).then(function(html){
      if(document.getElementById("rm").checked){try{localStorage.setItem(KEY,pw);}catch(e){}}
      show(html);
